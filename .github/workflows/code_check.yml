name: Code Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: code-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint & format check
        run: pnpm run lint

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      # ビルドは DB に接続しない（ページは動的に描画する）。接続文字列の形だけ渡す
      - name: Run build
        run: pnpm run build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mirai_gikai

      - name: Run unit tests
        run: pnpm run test
